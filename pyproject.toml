[project]
name = "assistant-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CatherineSalenko", email = "salenko.catherine@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "num2words>=0.5.14",
    "numpy>=2.5.5",
    "scikit-learn>=1.9.1",
    "sounddevice>=0.5.6",
    "torch>=2.15.0",
    "vosk==0.3.44",
]

[project.scripts]
assistant-bot = "assistant_bot.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
